# Publica el instalador Blaze (Windows NSIS) al pushear un tag v* o desde Actions.
# El instalador es mínimo (~200 MB): solo el front Tauri + estructura de carpetas.
# Todos los emuladores (PCSX2, RetroArch, Eden) y assets vendor (BIOS/keys/firmware)
# se descargan en runtime en la pantalla 'Preparando Blaze...' tras el primer login.

name: Release

on:
  push:
    tags:
      # Solo semver (v0.1.2). Evita que el tag "vendor" dispare el build.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin v (ej. 0.1.2). Vacío = package.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.version }}".Trim()) {
            $v = "${{ inputs.version }}".Trim().TrimStart("v")
            $tag = "v$v"
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Versión inválida: $version (esperado semver, ej. 0.1.2)"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag ($version)"

      - name: Sync version in project files
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding utf8

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`""
          Set-Content src-tauri/Cargo.toml -Value $cargo -Encoding utf8

      - name: Verificar estructura de recursos
        shell: pwsh
        run: |
          # Ya no empaquetamos ningún emulador en el instalador.
          # Todos los emuladores (PCSX2, RetroArch, Eden) se descargan en runtime.
          # Solo verificamos que existan las carpetas .gitkeep para el bundle.
          
          $required = @(
            "src-tauri/resources/pcsx2/.gitkeep",
            "src-tauri/resources/retroarch/.gitkeep",
            "src-tauri/resources/eden/.gitkeep"
          )
          
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Falta archivo requerido: $file"
            }
          }
          
          Write-Host "Estructura de recursos verificada. Instalador será mínimo (~200 MB)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          # Si el tag incluye cambios en .github/workflows/, GITHUB_TOKEN no puede
          # crear el Release. Usá un PAT classic (scopes: repo + workflow) como RELEASE_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Contenido de src-tauri/.updater/blaze.key (nunca al repo)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # URL del backend (Railway). Se embebe en el frontend en el build.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Blaze ${{ steps.ver.outputs.tag }}
          releaseBody: |
            Instalador Windows (NSIS) generado por GitHub Actions.

            Incluye packs de emuladores del Release `vendor`.
            Incluye `latest.json` + firmas para el updater de Blaze.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
