# Publica el instalador Blaze (Windows NSIS) al pushear un tag v* o desde Actions.
# Requisito: Release fijo "vendor" con:
#   bios.7z + eden-keys.7z + eden-firmware.7z + eden.7z
#   (PCSX2/RetroArch se descargan en runtime desde el manifiesto; no van en vendor/packs)
# bios / keys / firmware se extraen a resources/ y van en el instalador.

name: Release

on:
  push:
    tags:
      # Solo semver (v0.1.2). Evita que el tag "vendor" dispare el build.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin v (ej. 0.1.2). Vacío = package.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.version }}".Trim()) {
            $v = "${{ inputs.version }}".Trim().TrimStart("v")
            $tag = "v$v"
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Versión inválida: $version (esperado semver, ej. 0.1.2)"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag ($version)"

      - name: Sync version in project files
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding utf8

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`""
          Set-Content src-tauri/Cargo.toml -Value $cargo -Encoding utf8

      - name: Download vendor packs (Release tag vendor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Ya no descargamos ni embebemos BIOS/keys/firmware en el instalador.
          # Esos assets se descargan en runtime desde el backend tras el primer login.
          # Solo necesitamos eden.7z para el pack offline del emulador (sin red a git.eden-emu.dev).
          
          $packs = "src-tauri/resources/emulators/packs"
          $tmp = "_vendor"
          New-Item -ItemType Directory -Force -Path $packs, $tmp | Out-Null

          # Descargar solo eden.7z del Release vendor
          gh release download vendor --repo "${{ github.repository }}" --dir $tmp --pattern "eden.7z"
          if ($LASTEXITCODE -ne 0) {
            throw "Falta eden.7z en Release 'vendor'. Crealo y volvé a correr el Action."
          }

          $edenRt = Join-Path $tmp "eden.7z"
          if (-not (Test-Path $edenRt)) {
            throw "No se descargó eden.7z del Release vendor"
          }
          Copy-Item $edenRt (Join-Path $packs "eden.7z") -Force

          # Generar/actualizar blaze-bundle.json desde el .7z real + versión del manifiesto
          $manifest = Get-Content "src-tauri/runtimes.manifest.json" -Raw | ConvertFrom-Json
          $entry = $manifest.runtimes | Where-Object { $_.id -eq "eden" }
          if (-not $entry) { throw "Falta eden en runtimes.manifest.json" }
          $archive = Join-Path $packs "eden.7z"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $meta = @{ version = [string]$entry.version; sha256 = $hash } | ConvertTo-Json
          $metaPath = Join-Path $packs "eden.blaze-bundle.json"
          Set-Content -LiteralPath $metaPath -Value $meta -Encoding utf8
          Write-Host "bundle meta eden → version=$($entry.version) sha256=$hash"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          # Si el tag incluye cambios en .github/workflows/, GITHUB_TOKEN no puede
          # crear el Release. Usá un PAT classic (scopes: repo + workflow) como RELEASE_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Contenido de src-tauri/.updater/blaze.key (nunca al repo)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # URL del backend (Railway). Se embebe en el frontend en el build.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Blaze ${{ steps.ver.outputs.tag }}
          releaseBody: |
            Instalador Windows (NSIS) generado por GitHub Actions.

            Incluye packs de emuladores del Release `vendor`.
            Incluye `latest.json` + firmas para el updater de Blaze.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
