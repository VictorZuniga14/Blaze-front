# Verificación en cada PR / push a main: typecheck + tests TS + tests Rust.
# Corre en Windows (mismo target que el release; evita deps de webkit en Linux).

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests TS
        run: npm test

      # tauri::generate_context! exige que exista frontendDist (../dist).
      - name: Build front
        run: npx vite build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked
